<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Camera Simulator Setup{% endblock %}</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #dde3e8;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok-bg: #ecfdf5;
    --ok-border: #a7f3d0;
    --ok-text: #065f46;
    --err-bg: #fef2f2;
    --err-border: #fecaca;
    --err-text: #991b1b;
    --warn-bg: #fffbeb;
    --warn-border: #fde68a;
    --warn-text: #92400e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  header .sub { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }
  main {
    max-width: 860px;
    margin: 24px auto 80px;
    padding: 0 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 1rem;
    margin: 0 0 4px;
  }
  .panel .desc {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 16px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.8rem; color: var(--muted); }
  .field input[type=text],
  .field input[type=number] {
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fff;
    color: var(--text);
  }
  .field.checkbox { flex-direction: row; align-items: center; gap: 8px; }
  .field.checkbox label { font-size: 0.9rem; color: var(--text); }
  .actions { margin-top: 8px; }
  button, .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 7px;
    font-size: 0.95rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  button:hover, .btn:hover { background: var(--accent-hover); }
  .btn.secondary {
    background: #e5e7eb;
    color: #1f2937;
    padding: 7px 14px;
    font-size: 0.85rem;
  }
  .btn.secondary:hover { background: #d1d5db; }
  .discover-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .discover-row select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.85rem;
    max-width: 320px;
  }
  .banner {
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    border: 1px solid;
  }
  .banner.ok { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok-text); }
  .banner.err { background: var(--err-bg); border-color: var(--err-border); color: var(--err-text); }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn-text); }
  .banner ul { margin: 6px 0 0; padding-left: 20px; }
  .status-row { display: flex; gap: 24px; flex-wrap: wrap; font-size: 0.9rem; }
  .status-row div span.k { color: var(--muted); }
  .status-row div span.v { font-weight: 600; }
  a { color: var(--accent); }
  code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }
</style>
</head>
<body>
<header>
  <h1>{{ server_name }}</h1>
  <div class="sub">{% block subtitle %}Alpaca Camera Simulator{% endblock %} &mdash; configuration</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
