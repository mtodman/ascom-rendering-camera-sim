# Configuration for the ASCOM Alpaca camera simulator.

server:
  host: "0.0.0.0"
  # 11111/11112 are already in use on this host by other Alpaca simulators
  # (a mock telescope for testing, and an unrelated guide-sim project).
  port: 11115
  discovery_port: 32227
  server_name: "Alpaca Camera Simulator"
  manufacturer: "DIY"
  manufacturer_version: "1.0"
  location: "Simulated Observatory"

telescope:
  # Base URL of the Alpaca telescope device server to query for pointing.
  alpaca_base_url: "http://192.168.0.122:11112"
  device_number: 0
  # Used if the telescope is unreachable/not connected, or doesn't expose FocalLength/ApertureDiameter.
  fallback_ra_hours: 6.75258
  fallback_dec_deg: -16.7161
  fallback_focal_length_mm: 800.0
  fallback_aperture_diameter_mm: 200.0
  use_telescope_focal_length: true
  use_telescope_aperture: true
  request_timeout_s: 2.0

focuser:
  # Base URL of the Alpaca focuser device server to query for focus position,
  # to simulate defocus. Leave unreachable/unconfigured to always render in focus.
  alpaca_base_url: "http://192.168.0.184:11118"
  device_number: 0
  # Focuser step position that represents perfect focus for this setup - Alpaca's
  # Position property is just a raw step count with no defined zero, so this has
  # to be set explicitly (e.g. via the web setup page) to match wherever "in
  # focus" actually is.
  in_focus_position: 25480
  # Used if the focuser doesn't expose StepSize.
  fallback_step_size_um: 5.0
  use_focuser_step_size: true
  request_timeout_s: 2.0

filter_wheel:
  # Base URL of the Alpaca filter wheel device server to query for filter
  # position. Each filter's own FocusOffsets value (read from the device) is
  # added to the focuser's defocus, so a non-parfocal filter set shifts focus
  # repeatably by filter. Leave unreachable/unconfigured for no effect
  # (offset always 0).
  alpaca_base_url: "http://192.168.0.122:32323"
  device_number: 0
  request_timeout_s: 2.0

cover_calibrator:
  # Base URL of the Alpaca cover/calibrator device server to query for cover
  # state and calibrator brightness. Leave unreachable/unconfigured for no
  # effect (cover always treated as open, calibrator off).
  alpaca_base_url: "http://192.168.0.122:32323"
  device_number: 0
  # Used if the cover/calibrator is unreachable/not connected.
  fallback_cover_closed: false
  # Electrons/second/pixel the calibrator produces at Brightness == MaxBrightness;
  # scales linearly down with the device's reported Brightness fraction. Tuned
  # so a 1s exposure at max brightness uses ~75% of this camera's full well.
  calibrator_e_per_s_at_max_brightness: 1.5e4
  request_timeout_s: 2.0

camera:
  # 6248x4176 @ 3.76um matches the Sony IMX571 sensor (as used in cameras
  # like the ASI2600MM/QHY268M) - a larger, more realistic astro-camera
  # sensor than the original 1920x1080 placeholder.
  sensor_name: "Simulated CMOS 6248x4176 (IMX571-like)"
  sensor_type: "Monochrome"   # Monochrome | RGGB
  pixel_size_um: 3.76
  num_pixels_x: 6248
  num_pixels_y: 4176
  max_bin: 4
  can_asymmetric_bin: true
  can_fast_readout: true
  can_pulse_guide: true
  full_well_capacity_e: 20000.0
  max_adu: 65535
  read_noise_e: 2.5
  dark_current_e_per_s_per_px: 0.01
  bias_level_adu: 100
  electrons_per_adu: 1.0
  gain_min: 0
  gain_max: 100
  gain_default: 0
  offset_min: 0
  offset_max: 100
  offset_default: 0
  seeing_fwhm_arcsec: 2.5
  # Electrons/second collected at the sensor for a mag-0 star through the full aperture.
  zero_point_e_per_s_mag0: 5.0e7
  rotation_deg: 0.0
  flip_x: false
  flip_y: false
  exposure_min_s: 0.001
  exposure_max_s: 3600.0
  exposure_resolution_s: 0.001
  ambient_temp_c: 20.0
  max_cooldown_delta_c: 40.0
  cooling_rate_c_per_s: 2.0

catalog:
  # Tycho-2 plateaus hard around VTmag 13.5 (empirically confirmed: querying
  # deeper than that returns almost no additional stars) - this is its
  # practical depth limit, not an arbitrary choice.
  path: "data/tycho2_mag13_5.csv"
  limit_mag: 13.5
