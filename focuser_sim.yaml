# Configuration for the ASCOM Alpaca backlash focuser simulator
# (python -m focuser_sim.server). Everything here is also editable live from
# its web setup page: http://localhost:11118/setup

server:
  host: "0.0.0.0"
  # 11111-11117 are used by the camera simulator and its test stubs.
  port: 11118
  discovery_port: 32227
  server_name: "Alpaca Backlash Focuser Simulator"
  manufacturer: "DIY"
  manufacturer_version: "1.0"
  location: "Simulated Observatory"

focuser:
  # The drivetrain's slack: motor steps absorbed (the drawtube doesn't move)
  # whenever the focuser reverses direction, in either direction.
  backlash_steps: 100
  # Direction the drivetrain is engaged in at startup/reset ("in" or "out").
  initial_engaged_direction: "out"
  start_position: 25480
  max_step: 50000
  max_increment: 50000
  # Microns per step, reported as StepSize.
  step_size_um: 5.0
  # Motor speed; 0 makes every move complete instantly.
  steps_per_second: 500.0
  temperature_c: 10.0
